[package]
name = "ig_graph_flow_oracle"
version = "0.1.0"
edition = "2021"

[workspace]

[features]
default = []
host = ["imasm_core/std", "dep:serde_json"]

[lib]
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "graph_flow_oracle"
path = "src/bin/graph_flow_oracle.rs"
required-features = ["host"]

[dependencies]
imasm_core = { path = "../../../MoDoT/imasm_core", default-features = false }
serde_json = { version = "1", optional = true }

[profile.release]
panic = "abort"
opt-level = 2
codegen-units = 1
